<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Preview Gallery</title>
  <link rel="stylesheet" href="./base.css" />
  <link rel="stylesheet" href="./gallery.css" />
</head>
<body>
  <main class="app-shell gallery-shell">
    <header class="gallery-hero">
      <div>
        <p class="gallery-eyebrow">Image loading strategies</p>
        <h1>Photo gallery</h1>
        <p>Compare preview sources and progressive formats across every photo.</p>
      </div>
      <p class="utility-links">
        <a class="utility-link" href="./index.html">Back to Main Comparison</a>
        <a class="utility-link" href="./single-image-preview.html">Open Single-image Gallery</a>
        <a class="utility-link" href="./comparison-table.html">Open Comparison Table</a>
      </p>
    </header>

    <section class="gallery-toolbar" aria-labelledby="demoControlsTitle">
      <h2 id="demoControlsTitle" class="gallery-toolbar-title">Demo controls</h2>
      <label class="gallery-format-control">
        Loading strategy
        <select id="previewFormatSelect">
          <optgroup label="Preview source + original">
            <option value="blurhash">BlurHash</option>
            <option value="thumbhash">ThumbHash</option>
            <option value="lqip">LQIP / blur-up</option>
            <option value="avif">Inline AVIF</option>
          </optgroup>
          <optgroup label="Progressive image">
            <option value="progressive-jpeg">Progressive JPEG</option>
            <option value="interlaced-png">Adam7 interlaced PNG</option>
            <option value="progressive-avif">
              Progressive AVIF
            </option>
            <option value="progressive-jxl">
              Progressive JPEG XL (browser support required)
            </option>
          </optgroup>
        </select>
      </label>
      <div class="gallery-implementation">
        <span>Rendering path</span>
        <output id="implementationBadge" class="implementation-badge">Detecting...</output>
      </div>
      <label id="polyfillTransitionControl" class="gallery-transition-control" hidden>
        <span>Polyfill transition</span>
        <span class="gallery-checkbox">
          <input id="polyfillTransitionInput" type="checkbox" />
          Enabled
        </span>
      </label>
      <label id="polyfillBlurControl" class="gallery-transition-control" hidden>
        <span>Preview appearance</span>
        <span class="gallery-checkbox">
          <input id="polyfillBlurInput" type="checkbox" />
          Blur preview
        </span>
      </label>
      <button id="reloadGalleryButton" class="gallery-action-button" type="button">
        Replay loading
      </button>
    </section>

    <section class="gallery-summary" aria-live="polite">
      <output id="galleryStatus">Loading photo manifest...</output>
      <output id="photoCount">0 photos</output>
    </section>

    <section id="photoGallery" class="photo-gallery" aria-label="Photo preview gallery" aria-busy="true"></section>
  </main>

  <script type="module" src="./native-image-preview.js"></script>
</body>
</html>
